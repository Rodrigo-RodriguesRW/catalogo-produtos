{% extends 'admin/base.html' %}

{% block content %}

<div class="container mt-4">

    
<h2>Editar Produto #{{ produto.id }}</h2>

<hr>

<form
    action="{{ url_for('editarProduto', id=produto.id) }}"
    method="POST"
    enctype="multipart/form-data">


    <div class="mb-3">

        <label
            for="nome"
            class="form-label">

            Nome do Produto

        </label>

        <input
            type="text"
            class="form-control"
            id="nome"
            name="nome"
            value="{{ produto.nome }}"
            required>

    </div>


    <div class="mb-3">

        <label
            for="preco"
            class="form-label">

            Preço (R$)

        </label>

        <input
            type="number"
            step="0.01"
            class="form-control"
            id="preco"
            name="preco"
            value="{{ produto.preco }}"
            required>

    </div>


    <div class="mb-3">

        <label
            for="id_categoria"
            class="form-label">

            Categoria

        </label>

        <select
            class="form-select"
            id="id_categoria"
            name="id_categoria"
            required>

            <option value="">
                Selecione uma categoria
            </option>

            {% for categoria in categorias %}

            <option
                value="{{ categoria.id }}"
                {% if categoria.id == produto.id_categoria %}
                    selected
                {% endif %}>

                {{ categoria.nome }}

            </option>

            {% endfor %}

        </select>

    </div>


    <div class="mb-3">

        <label
            for="ativo"
            class="form-label">

            Status

        </label>

        <select
            class="form-select"
            id="ativo"
            name="ativo">

            <option
                value="True"
                {% if produto.ativo == 'True' or produto.ativo == 1 %}
                    selected
                {% endif %}>

                Ativo

            </option>

            <option
                value="False"
                {% if produto.ativo == 'False' or produto.ativo == 0 %}
                    selected
                {% endif %}>

                Inativo

            </option>

        </select>

    </div>


    <div class="mb-3">

        <label
            class="form-label d-block">

            Foto Atual

        </label>

        {% if produto.imagem %}

            <img
                src="data:image/jpeg;base64,{{ produto.imagem }}"
                width="120"
                class="img-thumbnail mb-2"
                alt="{{ produto.nome }}">

        {% else %}

            <p class="text-muted small">

                Nenhuma foto cadastrada para este produto.

            </p>

        {% endif %}

    </div>


    <div class="mb-3">

        <label
            for="imagem"
            class="form-label">

            Alterar Foto

        </label>

        <input
            type="file"
            class="form-control"
            id="imagem"
            name="imagem"
            accept="image/*">

        <small class="text-muted">

            Deixe em branco para manter a foto atual.

        </small>

    </div>


    <div class="mt-4">

        <button
            type="submit"
            class="btn btn-success">

            <i class="bi bi-check-circle"></i>

            Salvar Alterações

        </button>


        <a
            href="{{ url_for('listarProdutos') }}"
            class="btn btn-secondary">

            Cancelar

        </a>

    </div>


</form>


</div>

{% endblock %}
