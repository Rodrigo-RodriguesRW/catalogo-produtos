
{% extends 'admin/base.html' %}

{% block content %}

<div class="d-flex flex-column flex-md-row
            align-items-md-center justify-content-between
            gap-3 mb-4">

    <div>

        <h1 class="mb-1">
            Cadastrar Produto
        </h1>

        <p class="text-body-secondary mb-0">
            Adicione um novo produto ao catálogo.
        </p>

    </div>

</div>


<div class="card shadow-sm">

    <div class="card-header">

        <h3 class="card-title mb-0">

            <i class="bi bi-box-seam me-2"></i>

            Novo produto

        </h3>

    </div>


    <div class="card-body">

        <form
            method="POST"
            enctype="multipart/form-data">

            <div class="row g-3">

                <!-- Nome -->

                <div class="col-12">

                    <label
                        for="nome"
                        class="form-label">

                        Nome do Produto

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome do produto"
                        required>

                </div>


                <!-- Preço -->

                <div class="col-12 col-md-6">

                    <label
                        for="preco"
                        class="form-label">

                        Preço

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            R$
                        </span>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            class="form-control"
                            id="preco"
                            name="preco"
                            placeholder="25.90"
                            required>

                    </div>

                </div>


                <!-- Categoria -->

                <div class="col-12 col-md-6">

                    <label
                        for="id_categoria"
                        class="form-label">

                        Categoria

                    </label>

                    <select
                        class="form-select"
                        id="id_categoria"
                        name="id_categoria"
                        required>

                        <option value="">
                            Selecione uma categoria
                        </option>

                        {% for categoria in categorias %}

                            <option value="{{ categoria.id }}">
                                {{ categoria.nome }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Status -->

                <div class="col-12 col-md-6">

                    <label
                        for="ativo"
                        class="form-label">

                        Status

                    </label>

                    <select
                        class="form-select"
                        id="ativo"
                        name="ativo">

                        <option value="True">
                            Ativo
                        </option>

                        <option value="False">
                            Inativo
                        </option>

                    </select>

                </div>


                <!-- Imagem -->

                <div class="col-12 col-md-6">

                    <label
                        for="imagem"
                        class="form-label">

                        Imagem

                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="imagem"
                        name="imagem"
                        accept="image/*">

                    <div class="form-text">
                        Selecione uma imagem para representar o produto.
                    </div>

                </div>

            </div>


            <!-- Botões -->

            <div class="d-flex flex-column flex-sm-row
                        justify-content-end
                        gap-2
                        mt-4">

                <a
                    href="{{ url_for('listarProdutos') }}"
                    class="btn btn-secondary">

                    <i class="bi bi-arrow-left me-1"></i>

                    Cancelar

                </a>


                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle me-1"></i>

                    Cadastrar

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
