{% extends 'admin/base.html' %}

{% block content %}

<div class="container mt-4">
    <h2>Editar Produto #{{ produto.id }}</h2>
    <hr>

    <form action="{{ url_for('editarProduto', id=produto.id) }}" method="POST" enctype="multipart/form-data">
        
        <div class="mb-3">
            <label for="nome" class="form-label">Nome do Produto</label>
            <input type="text" class="form-control" id="nome" name="nome" value="{{ produto.nome }}" required>
        </div>

        <div class="mb-3">
            <label for="preco" class="form-label">Preço (R$)</label>
            <input type="number" step="0.01" class="form-control" id="preco" name="preco" value="{{ produto.preco }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Foto Atual</label>
            {% if produto.imagem %}
            <img src="data:image/jpeg;base64,{{ produto.imagem }}" width="120" class="img-thumbnail mb-2" alt="{{ produto.nome }}">
            {% else %}
            <p class="text-muted small">Nenhuma foto cadastrada para este produto.</p>
            {% endif %}
        </div>

        <div class="mb-3">
            <label for="imagem" class="form-label">Alterar Foto (Deixe em branco para manter a atual)</label>
            <input type="file" class="form-control" id="imagem" name="imagem" accept="image/*">
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Salvar Alterações
            </button>
            <a href="{{ url_for('listarProduto') }}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>

    </form>
</div>

{% endblock %}
