
{% extends 'admin/base.html' %}

{% block content %}

<div class="d-flex flex-column flex-md-row
            align-items-md-center justify-content-between
            gap-3 mb-4">

    <div>

        <h1 class="mb-1">
            Cadastrar Categoria
        </h1>

        <p class="text-body-secondary mb-0">
            Adicione uma nova categoria ao catálogo.
        </p>

    </div>

</div>


<div class="card shadow-sm">

    <div class="card-header">

        <h3 class="card-title mb-0">

            <i class="bi bi-plus-circle me-2"></i>

            Nova categoria

        </h3>

    </div>


    <div class="card-body">

        <form
            method="POST"
            enctype="multipart/form-data">

            <div class="row g-3">

                <!-- Nome -->

                <div class="col-12">

                    <label
                        for="nome_categoria"
                        class="form-label">

                        Nome da Categoria

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nome_categoria"
                        name="nome_categoria"
                        placeholder="Digite o nome da categoria"
                        required>

                </div>


                <!-- Descrição -->

                <div class="col-12">

                    <label
                        for="descricao"
                        class="form-label">

                        Descrição

                    </label>

                    <textarea
                        class="form-control"
                        id="descricao"
                        name="descricao"
                        rows="4"
                        placeholder="Digite uma descrição para a categoria"
                        required></textarea>

                </div>


                <!-- Status -->

                <div class="col-12 col-md-6">

                    <label
                        for="ativo"
                        class="form-label">

                        Status

                    </label>

                    <select
                        class="form-select"
                        id="ativo"
                        name="ativo">

                        <option value="True">
                            Ativo
                        </option>

                        <option value="False">
                            Inativo
                        </option>

                    </select>

                </div>


                <!-- Imagem -->

                <div class="col-12 col-md-6">

                    <label
                        for="imagem"
                        class="form-label">

                        Imagem

                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="imagem"
                        name="imagem"
                        accept="image/*">

                    <div class="form-text">
                        Selecione uma imagem para representar a categoria.
                    </div>

                </div>

            </div>


            <!-- Botões -->

            <div class="d-flex flex-column flex-sm-row
                        justify-content-end
                        gap-2
                        mt-4">

                <a
                    href="{{ url_for('listarCategoria') }}"
                    class="btn btn-secondary">

                    <i class="bi bi-arrow-left me-1"></i>

                    Voltar

                </a>


                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle me-1"></i>

                    Cadastrar

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
