
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Entrar | Catálogo de Produtos</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dist/css/adminlte.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f0ff, #f8fafc);
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        .login-icon {
            font-size: 3rem;
            color: #0d6efd;
        }

        .form-control {
            min-height: 45px;
        }
    </style>
</head>

<body>

    <main class="card login-card">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <i class="bi bi-box-seam login-icon"></i>

                <h1 class="h3 mt-3">Catálogo de Produtos</h1>

                <p class="text-secondary">
                    Entre para acessar a administração
                </p>
            </div>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    {% for categoria, mensagem in mensagens %}
                        <div class="alert alert-{{ categoria }}" role="alert">
                            {{ mensagem }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">

                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome do administrador
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Entrar
                </button>

            </form>

            <div class="text-center mt-4">
                <small class="text-secondary">
                    Acesso restrito ao administrador
                </small>
            </div>

        </div>
    </main>

</body>
</html>
