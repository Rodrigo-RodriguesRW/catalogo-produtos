{% extends 'admin/base.html' %}

{% block content %}

<h3 style="background-color: rgb(198, 197, 197);">
    Cadastrar Produto
</h3>

<div class="container">


<form method="POST" enctype="multipart/form-data">

    <div class="form-group mb-3">
        <label for="nome">
            Nome do Produto:
        </label>

        <input
            type="text"
            class="form-control"
            id="nome"
            name="nome"
            required>
    </div>


    <div class="form-group mb-3">
        <label for="preco">
            Preço:
        </label>

        <input
            type="number"
            step="0.01"
            class="form-control"
            id="preco"
            name="preco"
            placeholder="Ex: 25.90"
            required>
    </div>


    <div class="form-group mb-3">
        <label for="id_categoria">
            Categoria:
        </label>

        <select
            class="form-select"
            id="id_categoria"
            name="id_categoria"
            required>

            <option value="">
                Selecione uma categoria
            </option>

            {% for categoria in categorias %}

            <option value="{{ categoria.id }}">
                {{ categoria.nome }}
            </option>

            {% endfor %}

        </select>
    </div>


    <div class="form-group mb-3">
        <label for="ativo" class="form-label">
            Status
        </label>

        <select
            class="form-select"
            id="ativo"
            name="ativo">

            <option value="True">
                Ativo
            </option>

            <option value="False">
                Inativo
            </option>

        </select>
    </div>


    <div class="form-group mb-3">
        <label for="imagem">
            Imagem:
        </label>

        <input
            type="file"
            class="form-control"
            id="imagem"
            name="imagem"
            accept="image/*">

    </div>


    <br>

    <button
        type="submit"
        class="btn btn-primary mb-2">

        Cadastrar

    </button>

    <a
        href="{{ url_for('listarProdutos') }}"
        class="btn btn-secondary mb-2">

        Cancelar

    </a>

</form>


</div>

{% endblock %}
