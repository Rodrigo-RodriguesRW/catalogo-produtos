{% extends 'admin/base.html' %}

{% block content %}

<h3 style="background-color: rgb(198, 197, 197);">
    Editar Categoria
</h3>

<div class="container">

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="nome_categoria">
                Nome da Categoria:
            </label>

            <input
                type="text"
                class="form-control"
                id="nome_categoria"
                value="{{ categoria.nome }}"
                name="nome_categoria"
                required>
        </div>


        <div class="form-group">
            <label for="descricao">
                Descrição:
            </label>

            <input
                type="text"
                class="form-control"
                value="{{ categoria.descricao }}"
                id="descricao"
                name="descricao"
                required>
        </div>


        <div class="form-group">
            <label for="ativo" class="form-label">
                Status
            </label>

            <select
                class="form-select"
                name="ativo"
                id="ativo">

                <option
                    value="True"
                    {% if categoria.ativo == 'True' %}selected{% endif %}>
                    Ativo
                </option>

                <option
                    value="False"
                    {% if categoria.ativo == 'False' %}selected{% endif %}>
                    Inativo
                </option>

            </select>
        </div>


        <div class="form-group">
            <label for="imagem_atual">
                Imagem Atual:
            </label>

            {% if categoria.imagem %}

            <br>

            <img
                src="data:image/jpeg;base64,{{ categoria.imagem }}"
                alt="Imagem Atual"
                style="width: 200px;">

            {% else %}

            <p class="text-muted">
                Nenhuma imagem cadastrada.
            </p>

            {% endif %}

        </div>


        <div class="form-group">
            <label for="imagem">
                Nova imagem:
            </label>

            <input
                type="file"
                class="form-control"
                id="imagem"
                name="imagem"
                accept="image/*">

        </div>


        <br>

        <button
            type="submit"
            class="btn btn-primary mb-2">

            Salvar Alterações

        </button>

    </form>

</div>

{% endblock %}
